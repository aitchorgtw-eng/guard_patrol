<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巡邏打卡工具 (V13 雙視角排班版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
        .panel { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .control-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        input[type="number"], input[type="text"], select { padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .param-row { display: flex; gap: 10px; }
        .param-row .control-group { flex: 1; }
        button { padding: 10px 15px; background: #4a90e2; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;}
        button:active { background: #357abd; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-full { width: 100%; margin-top: 5px; padding: 15px 20px; font-size: 18px; }
        .log { margin-top: 20px; font-family: monospace; background: #222; color: #0f0; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 12px; height: 100px; overflow-y: auto;}
        .highlight { border-left: 4px solid #4a90e2; padding-left: 10px; }
        .lock-warning { color: #d32f2f; font-weight: bold; padding: 10px; background: #ffebee; border-radius: 4px; text-align: center; margin-bottom: 10px; display: none; }
        #adminPanel { display: none; border: 2px solid #9c27b0; background: #fdfaf6; padding: 20px;}
        #qrcode-container { margin-top: 15px; display: flex; flex-direction: column; align-items: center; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;}
        #secretLock { display: block; text-align: center; margin-top: 30px; font-size: 24px; opacity: 0.15; cursor: pointer; user-select: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background-color: #f5f5f5; font-weight: bold; }
        .bg-orange { background-color: #ffe0b2 !important; color: #e65100; font-weight: bold; } 
        .bg-red { background-color: #ffcdd2 !important; color: #c62828; font-weight: bold; }   
        .bg-green { background-color: #c8e6c9 !important; color: #2e7d32; }                     
        .bg-gray { background-color: #f5f5f5 !important; color: #9e9e9e; font-style: italic; }
        .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #e3f2fd; padding: 10px; border-radius: 4px;}
    </style>
</head>
<body>

    <!-- 警衛唯一可見區域 (含今日狀態) -->
    <div class="panel highlight" id="guardPanel">
        <h3>📍 當前掃描站點</h3>
        <div id="lockWarning" class="lock-warning">⚠️ 系統鎖定：請掃描巡邏點 QR Code，禁止手動打卡。</div>
        <div class="control-group">
            <input type="text" id="locationInput" value="" placeholder="等待 QR Code..." readonly style="background:#fff3e0; font-size: 16px; font-weight: bold; color: #e65100; text-align: center;">
        </div>
        <button id="checkInBtn" class="btn-full" onclick="executeCheckIn()" disabled>送出定位與打卡紀錄</button>
        
        <!-- 警衛專用：今日動態 -->
        <div style="margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 15px;">
            <h4 style="margin:0 0 10px 0;">📋 今日巡檢動態 (路線 Z)</h4>
            <div id="guardDashboardContainer">系統載入中...</div>
        </div>
    </div>

    <div class="log" id="consoleLog">系統初始化... 等待操作...</div>
    <span id="secretLock" onclick="verifyAdminPin()">🔏</span>

    <!-- ================= 主管解鎖區域 ================= -->
    <div id="adminPanel">
        <h2 style="color: #9c27b0; text-align: center; border-bottom: 2px solid #9c27b0; padding-bottom: 10px;">🛡️ 主管控制中心</h2>
        
        <div class="panel" style="background: #fff;">
            <h3>⚙️ 系統參數調校</h3>
            <div class="control-group">
                <label>API 網址 (V13)：</label>
                <!-- ⚠️ 請替換為您的 V13 GAS URL ⚠️ -->
                <input type="text" id="apiUrl" value="https://script.google.com/macros/s/AKfycbymgBcvvzq45TznnxfayEYKOEFl2zxX3E-0SDoZjl0ZuRpkROjGaSFujEbFYx3nQ-ohtw/exec" readonly style="background:#e9ecef;">
            </div>
            <div class="param-row">
                <div class="control-group"><label>時間容忍 (分)：</label><input type="number" id="timeBuffer" value="10"></div>
                <div class="control-group"><label>GPS精度 (公尺)：</label><input type="number" id="gpsAccuracy" value="12"></div>
                <div class="control-group"><label>距離異常 (公尺)：</label><input type="number" id="distanceTol" value="10" style="background:#ffe0b2; color:#e65100; font-weight:bold;"></div>
            </div>
        </div>

        <div class="panel" style="background: #fff;">
            <h3>🖨️ 標籤產生器</h3>
            <div class="control-group">
                <select id="genLocationSelect">
                    <optgroup label="路線 Z (測試線)"><option value="A99 >> 資訊室">A99 >> 資訊室</option><option value="C02 >> 03F 茶水間">C02 >> 03F 茶水間</option></optgroup>
                    <optgroup label="路線 A"><option value="A01 >> 13F 恩典前頂樓">A01 >> 13F 恩典前頂樓</option></optgroup>
                </select>
            </div>
            <button onclick="generateQRCode()" class="btn-full" style="background: #9c27b0;">產生 QR Code</button>
            <div id="qrcode-container"><div id="qrcode"></div><p id="qr-text" style="font-weight: bold;"></p></div>
        </div>

        <!-- 主管專用：一週儀表板 -->
        <div class="panel" style="background: #fff;">
            <h3>📊 巡檢狀態儀表板 (支援缺漏偵測)</h3>
            <div class="nav-controls">
                <button onclick="changeWeekOffset(-1)">◀ 上一週</button>
                <span id="weekDisplayLabel" style="font-weight:bold; color:#1565c0;">本週</span>
                <button onclick="changeWeekOffset(1)">下一週 ▶</button>
            </div>
            <div class="control-group">
                <label>選擇檢視路線：</label>
                <select id="dashboardRouteSelect" onchange="refreshDashboard()">
                    <option value="Z">路線 Z (A99, C02)</option>
                </select>
            </div>
            <div id="adminDashboardContainer" style="overflow-x: auto;"></div>
        </div>
    </div>

    <script>
        let currentWeekOffset = 0; // 0=本週, -1=上週
        let cachedLogs = []; // 快取資料庫回傳結果，減少網路請求

        function logMsg(msg, type = 'info') {
            const logBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            let color = type === 'error' ? 'color:#ff4444;' : type === 'warning' ? 'color:#ffeb3b;' : '';
            logBox.innerHTML += `\n<span style="${color}">${time} [系統] ${msg}</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const locParam = urlParams.get('loc'); 
            if (locParam) {
                document.getElementById('locationInput').value = decodeURIComponent(locParam);
                document.getElementById('checkInBtn').disabled = false;
                logMsg(`✅ QR Code 辨識成功，解鎖打卡。`);
                // 警衛模式：啟動時自動抓取今日資料
                fetchDataAndRender(true);
            } else {
                document.getElementById('lockWarning').style.display = 'block';
            }
        });

        function verifyAdminPin() {
            const pin = prompt("請輸入主管密碼：");
            if (!pin) return;
            const apiUrl = document.getElementById('apiUrl').value.trim();
            logMsg("連線至資料庫驗證權限中...");

            fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: "verify_pin", pin: pin }) })
            .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
            .then(result => {
                if (result.result === "success") {
                    logMsg("✅ 解鎖成功。");
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('guardPanel').style.display = 'none';
                    document.getElementById('secretLock').style.display = 'none';
                    // 主管模式：啟動時自動抓取本週資料
                    fetchDataAndRender(false);
                } else { alert("密碼錯誤"); }
            }).catch(e => logMsg(`連線失敗 (請確認 GAS 已發佈新版)：${e.message}`, "error"));
        }

        function generateQRCode() {
            const loc = document.getElementById('genLocationSelect').value;
            const targetUrl = `${window.location.origin}${window.location.pathname}?loc=${encodeURIComponent(loc)}`;
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, { text: targetUrl, width: 180, height: 180 });
            document.getElementById('qr-text').innerText = loc;
        }

        function executeCheckIn() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const locationStr = document.getElementById('locationInput').value;
            const btn = document.getElementById('checkInBtn');
            const distTol = document.getElementById('distanceTol').value;
            if (!locationStr) return; 

            btn.disabled = true; btn.innerText = "傳輸中...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const payload = { action: "check_in", location: locationStr, lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6), accuracy: parseFloat(pos.coords.accuracy.toFixed(1)), distanceTol: distTol, status: "正常" };
                    fetch(apiUrl, { method: 'POST', body: JSON.stringify(payload) })
                    .then(res => res.json())
                    .then(result => {
                        if (result.result === "success") {
                            logMsg(`✅ 打卡完成！`); btn.innerText = "已完成";
                            fetchDataAndRender(true); // 打卡完自動刷新警衛儀表板
                        } else { btn.disabled = false; btn.innerText = "重試"; }
                    });
                },
                (err) => { logMsg("定位失敗", "error"); btn.disabled = false; btn.innerText = "重試"; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // ================= V13 排班與缺漏偵測引擎 =================
        function changeWeekOffset(delta) {
            currentWeekOffset += delta;
            let label = currentWeekOffset === 0 ? "本週" : currentWeekOffset < 0 ? `前 ${Math.abs(currentWeekOffset)} 週` : `後 ${currentWeekOffset} 週`;
            document.getElementById('weekDisplayLabel').innerText = label;
            refreshDashboard();
        }

        function refreshDashboard() {
            renderScheduleMatrix(cachedLogs, false);
        }

        function fetchDataAndRender(isGuardView) {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            logMsg("同步資料庫中...");
            fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: "get_logs" }) })
            .then(res => res.json())
            .then(result => {
                if(result.result === "success") {
                    cachedLogs = result.data;
                    renderScheduleMatrix(cachedLogs, isGuardView);
                    logMsg("✅ 資料同步完成。");
                }
            }).catch(e => logMsg(`載入失敗`, "error"));
        }

        // 資料清洗：將 Google Sheet "2026/10/8 上午 11:14:43" 轉為標準 Date 物件
        function parseSheetDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split(' ');
            if (parts.length < 3) return new Date(dateStr); // Fallback
            const datePart = parts[0]; 
            const ampm = parts[1];
            const timePart = parts[2];
            let [h, m, s] = timePart.split(':').map(Number);
            if (ampm === '下午' && h !== 12) h += 12;
            if (ampm === '上午' && h === 12) h = 0;
            return new Date(`${datePart} ${h}:${m}:${s}`);
        }

        // 核心渲染邏輯 (動態比對槽位)
        function renderScheduleMatrix(logs, isGuardView) {
            const container = document.getElementById(isGuardView ? 'guardDashboardContainer' : 'adminDashboardContainer');
            const timeTol = parseInt(document.getElementById('timeBuffer').value);
            
            // 定義路線 Z 的固定班表 (每日應打卡的 4 個點)
            const zSchedule = [
                { time: "10:00", loc: "A99 >> 資訊室", mins: 600 },
                { time: "10:00", loc: "C02 >> 03F 茶水間", mins: 600 },
                { time: "13:30", loc: "A99 >> 資訊室", mins: 810 },
                { time: "13:30", loc: "C02 >> 03F 茶水間", mins: 810 }
            ];

            // 決定要渲染的日期範圍
            let targetDates = [];
            const today = new Date();
            today.setHours(0,0,0,0);

            if (isGuardView) {
                targetDates.push(new Date(today)); // 警衛只看今天
            } else {
                // 主管看一週 (週一至週日)
                const dayOfWeek = today.getDay() || 7; // 1-7
                const monday = new Date(today);
                monday.setDate(today.getDate() - dayOfWeek + 1 + (currentWeekOffset * 7));
                for(let i=0; i<7; i++) {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    targetDates.push(d);
                }
            }

            let html = `<table><tr><th>日期</th><th>預定時間</th><th>站點</th><th>打卡紀錄 / 狀態</th></tr>`;
            
            // 雙層迴圈：遍歷每一天 -> 遍歷每一個應打卡的班表槽位
            // 反向迴圈讓日期由新到舊顯示
            for (let i = targetDates.length - 1; i >= 0; i--) {
                const targetDate = targetDates[i];
                const dateString = `${targetDate.getFullYear()}/${targetDate.getMonth()+1}/${targetDate.getDate()}`;
                const isFuture = targetDate > today;

                zSchedule.forEach(slot => {
                    let rowClass = "";
                    let displayTime = "--:--";
                    let displayStatus = "";
                    
                    // 在 logs 中尋找符合該日期、地點，且時間在容忍範圍內的紀錄
                    let matchedLog = null;
                    for (let row of logs) {
                        if (!row[0]) continue;
                        const logDate = parseSheetDate(row[0]);
                        if (!logDate) continue;
                        
                        // 檢查日期與地點是否相符
                        if (logDate.getFullYear() === targetDate.getFullYear() &&
                            logDate.getMonth() === targetDate.getMonth() &&
                            logDate.getDate() === targetDate.getDate() &&
                            row[1] === slot.loc) {
                            
                            // 檢查時間是否在容忍範圍內 (分鐘數比對)
                            const logMins = logDate.getHours() * 60 + logDate.getMinutes();
                            if (logMins >= slot.mins - timeTol && logMins <= slot.mins + timeTol) {
                                matchedLog = { time: row[0].split(' ')[2], distMsg: row[7] || "" };
                                break; 
                            }
                        }
                    }

                    if (matchedLog) {
                        // 有打卡紀錄，依距離判定顏色
                        if (matchedLog.distMsg.includes("距離異常") || matchedLog.distMsg.includes("無基準資料")) {
                            rowClass = "bg-orange";
                            displayStatus = `🟠 ${matchedLog.distMsg}`;
                        } else {
                            rowClass = "bg-green";
                            displayStatus = `🟢 正常打卡`;
                        }
                        displayTime = matchedLog.time;
                    } else {
                        // 無打卡紀錄
                        if (isFuture) {
                            rowClass = "bg-gray";
                            displayStatus = "未到班";
                        } else {
                            rowClass = "bg-red";
                            displayStatus = "🔴 缺漏 (未打卡)";
                        }
                    }

                    html += `<tr class="${rowClass}">
                                <td>${dateString}</td>
                                <td>${slot.time}</td>
                                <td>${slot.loc}</td>
                                <td>${displayTime} <br> <span style="font-size:11px;">${displayStatus}</span></td>
                             </tr>`;
                });
            }
            
            html += `</table>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
