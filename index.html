<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巡邏打卡工具 (V9 雲端權限版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
        .panel { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .control-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        input[type="number"], input[type="text"], select { padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .param-row { display: flex; gap: 10px; }
        .param-row .control-group { flex: 1; }
        button { padding: 15px 20px; background: #4a90e2; color: #fff; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px;}
        button:active { background: #357abd; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .log { margin-top: 20px; font-family: monospace; background: #222; color: #0f0; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 12px; height: 150px; overflow-y: auto;}
        .error { color: #ff4444; }
        .warning { color: #ffeb3b; }
        .highlight { border-left: 4px solid #4a90e2; padding-left: 10px; }
        .lock-warning { color: #d32f2f; font-weight: bold; padding: 10px; background: #ffebee; border-radius: 4px; text-align: center; margin-bottom: 10px; display: none; }
        
        #adminPanel { display: none; border: 2px dashed #9c27b0; background: #f3e5f5; }
        #qrcode-container { margin-top: 15px; display: flex; flex-direction: column; align-items: center; background: #fff; padding: 20px; border-radius: 8px; }
        
        #browserWarning { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(211, 47, 47, 0.95); color: white; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; }
        #browserWarning h1 { font-size: 24px; margin-bottom: 10px; }
        #browserWarning p { font-size: 18px; line-height: 1.5; }

        /* 隱蔽鎖頭樣式 */
        #secretLock { display: block; text-align: center; margin-top: 30px; font-size: 24px; opacity: 0.15; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

    <div id="browserWarning">
        <h1>⚠️ 系統阻擋：環境不支援</h1>
        <p>您目前使用的是 LINE 或內建瀏覽器，無法取得 GPS 定位。</p>
        <p style="font-weight: bold; background: #fff; color: #d32f2f; padding: 10px; border-radius: 5px; margin-top: 20px;">👉 請點選右上角「選單 ⋮」以預設瀏覽器開啟。</p>
    </div>

    <div class="panel">
        <h3>⚙️ 系統參數調校面板</h3>
        <div class="control-group">
            <label>後端 API 網址 (系統預載)：</label>
            <!-- ⚠️ 記得替換為您 V9 重新部署後的 GAS URL ⚠️ -->
            <input type="text" id="apiUrl" value="https://script.google.com/macros/s/AKfycbzhu2v1lOj8Av_WAt3lMxxTL_Kgbbf2zh38BIql91M_C-qMqEd5TfU93s5_ekcxpYe-Ow/exec" readonly style="background:#e9ecef; font-size: 10px; color:#555;">
        </div>
        <div class="param-row">
            <div class="control-group">
                <label>容忍時間 (分)：</label><input type="number" id="timeBuffer" value="10" readonly style="background:#e9ecef;">
            </div>
            <div class="control-group">
                <label>精度要求 (公尺)：</label><input type="number" id="gpsAccuracy" value="12" readonly style="background:#e9ecef;">
            </div>
        </div>
    </div>

    <!-- 警衛視角 -->
    <div class="panel highlight" id="guardPanel">
        <h3>📍 當前掃描站點</h3>
        <div id="lockWarning" class="lock-warning">⚠️ 系統鎖定：請使用相機掃描巡邏點 QR Code，禁止手動打卡。</div>
        <div class="control-group">
            <input type="text" id="locationInput" value="" placeholder="等待 QR Code 參數載入..." readonly style="background:#fff3e0; font-size: 16px; font-weight: bold; color: #e65100; text-align: center;">
        </div>
        <button id="checkInBtn" onclick="executeCheckIn()" disabled>送出定位與打卡紀錄</button>
    </div>

    <div class="log" id="consoleLog">系統初始化... 檢查運行環境中...</div>

    <!-- 主管 QR 產生器 (由密碼解鎖) -->
    <div class="panel" id="adminPanel">
        <h3 style="color: #9c27b0;">🖨️ QR Code 標籤產生器 (主管模式已解鎖)</h3>
        <div class="control-group">
            <label>1. 選擇要建立 QR Code 的巡邏點：</label>
            <select id="genLocationSelect">
                <!-- A線 -->
                <optgroup label="路線 A：恩典盼望線"><option value="A01 >> 13F 恩典前頂樓">A01 >> 13F 恩典前頂樓</option><option value="A02 >> 11F 執行長室">A02 >> 11F 執行長室</option><option value="A03 >> 10F 護理站">A03 >> 10F 護理站</option><option value="A04 >> 09F 護理站">A04 >> 09F 護理站</option><option value="A05 >> 08F 護理站">A05 >> 08F 護理站</option><option value="A06 >> 07F 員工廁所外">A06 >> 07F 員工廁所外</option><option value="A07 >> 06F 醫務部外">A07 >> 06F 醫務部外</option><option value="A08 >> 05F 親子廁所外">A08 >> 05F 親子廁所外</option><option value="A16 >> 03F 恩典樓">A16 >> 03F 恩典樓</option><option value="A09 >> 03F 盼望樓治療室">A09 >> 03F 盼望樓治療室</option><option value="A10 >> 02F 門診大廳">A10 >> 02F 門診大廳</option><option value="A11 >> 01F 掛號大廳">A11 >> 01F 掛號大廳</option><option value="A12 >> B1 工務室">A12 >> B1 工務室</option><option value="A13 >> B1 放腫科辦公室">A13 >> B1 放腫科辦公室</option><option value="A14 >> B2 停車場">A14 >> B2 停車場</option><option value="A15 >> B3 停車場">A15 >> B3 停車場</option></optgroup>
                <!-- B線 -->
                <optgroup label="路線 B：恩典後樓梯線"><option value="B01 >> 13F 恩典後頂樓">B01 >> 13F 恩典後頂樓</option><option value="B02 >> 11F 淨水 RO 機房">B02 >> 11F 淨水 RO 機房</option><option value="B03 >> 10F 禱告室">B03 >> 10F 禱告室</option><option value="B04 >> 09F 禱告室">B04 >> 09F 禱告室</option><option value="B05 >> 08F 禱告室">B05 >> 08F 禱告室</option><option value="B06 >> 06F 貨運樓梯間">B06 >> 06F 貨運樓梯間</option><option value="B07 >> 03F 貨運樓梯間">B07 >> 03F 貨運樓梯間</option><option value="B08 >> B1 車道口">B08 >> B1 車道口</option><option value="B09 >> B3 貨運樓梯間">B09 >> B3 貨運樓梯間</option></optgroup>
                <!-- C線 -->
                <optgroup label="路線 C：慈愛樓線"><option value="C01 >> 05F 中醫">C01 >> 05F 中醫</option><option value="C02 >> 03F 茶水間">C02 >> 03F 茶水間</option><option value="C03 >> 02F 牙科">C03 >> 02F 牙科</option></optgroup>
                <!-- D線 -->
                <optgroup label="路線 D：迦南+外圍線"><option value="D01 >> 垃圾屋">D01 >> 垃圾屋</option><option value="D02 >> 前面頂樓">D02 >> 前面頂樓</option><option value="D03 >> 04F 會館前門">D03 >> 04F 會館前門</option><option value="D04 >> 02F 樓梯間">D04 >> 02F 樓梯間</option><option value="D05 >> B1F 停車場">D05 >> B1F 停車場</option><option value="D06 >> 後方頂樓">D06 >> 後方頂樓</option><option value="D07 >> 04F 會館後門">D07 >> 04F 會館後門</option><option value="D08 >> 01F 後門">D08 >> 01F 後門</option><option value="D09 >> 迦南後院">D09 >> 迦南後院</option><option value="D10 >> 四維路停車場">D10 >> 四維路停車場</option><option value="D11 >> 開封街大門">D11 >> 開封街大門</option><option value="D12 >> 員工機車棚">D12 >> 員工機車棚</option></optgroup>
            </select>
        </div>
        <button onclick="generateQRCode()" style="background: #9c27b0;">2. 產生該點專屬 QR Code</button>
        <div id="qrcode-container"><div id="qrcode"></div><p id="qr-text" style="font-weight: bold; margin-top: 10px; font-size: 18px; color: #333;"></p></div>
    </div>

    <!-- 隱蔽解鎖觸發點 -->
    <span id="secretLock" onclick="verifyAdminPin()">🔏</span>

    <script>
        function logMsg(msg, type = 'info') {
            const logBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            let prefix = '[系統] ', colorClass = '';
            if (type === 'error') { prefix = '[錯誤] '; colorClass = 'class="error"'; }
            if (type === 'warning') { prefix = '[警告] '; colorClass = 'class="warning"'; }
            logBox.innerHTML += `\n<span ${colorClass}>${time} ${prefix}${msg}</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        let qrcodeObj = null;

        document.addEventListener('DOMContentLoaded', () => {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/Line|FBAV|Instagram/i.test(userAgent)) {
                document.getElementById('browserWarning').style.display = 'flex';
                document.body.style.overflow = 'hidden';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const locParam = urlParams.get('loc'); 
            
            if (locParam) {
                document.getElementById('locationInput').value = decodeURIComponent(locParam);
                document.getElementById('checkInBtn').disabled = false;
                logMsg(`✅ 成功辨識 QR Code：${decodeURIComponent(locParam)}，系統解鎖。`);
            } else {
                document.getElementById('lockWarning').style.display = 'block';
                logMsg("未偵測到地點參數，拒絕解鎖打卡功能。", "error");
            }
        });

        // 🚨 呼叫 GAS 進行密碼驗證 🚨
        function verifyAdminPin() {
            const pin = prompt("請輸入主管查核密碼：");
            if (!pin) return;

            const apiUrl = document.getElementById('apiUrl').value.trim();
            logMsg("連線至資料庫驗證密碼中...");

            fetch(apiUrl, {
                method: 'POST',
                body: JSON.stringify({ action: "verify_pin", pin: pin })
            })
            .then(response => response.json())
            .then(result => {
                if (result.result === "success") {
                    logMsg("✅ 密碼驗證通過，已開啟主管面板。");
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('guardPanel').style.display = 'none';
                    document.getElementById('secretLock').style.display = 'none';
                } else {
                    logMsg(`密碼錯誤：${result.message}`, "error");
                    alert("密碼錯誤！");
                }
            })
            .catch(error => { logMsg(`網路連線異常：${error.message}`, "error"); });
        }

        function generateQRCode() {
            const loc = document.getElementById('genLocationSelect').value;
            const qrContainer = document.getElementById('qrcode');
            const targetUrl = `${window.location.origin}${window.location.pathname}?loc=${encodeURIComponent(loc)}`;
            qrContainer.innerHTML = '';
            qrcodeObj = new QRCode(qrContainer, { text: targetUrl, width: 200, height: 200, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H });
            document.getElementById('qr-text').innerText = `巡邏點：${loc}`;
            logMsg(`已產生 [${loc}] 的 QR Code`);
        }

        // 打卡邏輯需加上 action: "check_in" 參數
        function executeCheckIn() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const locationStr = document.getElementById('locationInput').value;
            const btn = document.getElementById('checkInBtn');
            if (!locationStr) return; 

            btn.disabled = true; btn.innerText = "資料驗證與傳輸中...";
            logMsg("啟動定位模組...");

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    const payload = { 
                        action: "check_in", // 告訴 GAS 這是打卡動作
                        location: locationStr, lat: lat, lng: lng, 
                        accuracy: parseFloat(position.coords.accuracy.toFixed(1)), 
                        status: "正常" 
                    };

                    fetch(apiUrl, { method: 'POST', body: JSON.stringify(payload) })
                    .then(response => response.json())
                    .then(result => {
                        if (result.result === "success") {
                            logMsg(`✅ [${locationStr}] 打卡成功！`);
                            btn.innerText = "打卡完成，請關閉網頁";
                        } else {
                            logMsg(`寫入失敗：${result.message}`, "error");
                            btn.disabled = false; btn.innerText = "重試打卡";
                        }
                    })
                    .catch(error => { logMsg(`傳輸錯誤：${error.message}`, "error"); btn.disabled = false; btn.innerText = "重試打卡"; });
                },
                (error) => { logMsg("定位失敗", "error"); btn.disabled = false; btn.innerText = "重新定位與打卡"; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
