<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巡邏打卡工具 (V7 環境防禦版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
        .panel { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .control-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        input[type="number"], input[type="text"], select { padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .param-row { display: flex; gap: 10px; }
        .param-row .control-group { flex: 1; }
        button { padding: 15px 20px; background: #4a90e2; color: #fff; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px;}
        button:active { background: #357abd; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .log { margin-top: 20px; font-family: monospace; background: #222; color: #0f0; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 12px; height: 150px; overflow-y: auto;}
        .error { color: #ff4444; }
        .warning { color: #ffeb3b; }
        .highlight { border-left: 4px solid #4a90e2; padding-left: 10px; }
        .lock-warning { color: #d32f2f; font-weight: bold; padding: 10px; background: #ffebee; border-radius: 4px; text-align: center; margin-bottom: 10px; display: none; }
        
        /* 管理員面板樣式 */
        #adminPanel { display: none; border: 2px dashed #9c27b0; background: #f3e5f5; }
        #qrcode-container { margin-top: 15px; display: flex; flex-direction: column; align-items: center; background: #fff; padding: 20px; border-radius: 8px; }
        .admin-toggle { background: transparent; color: #9c27b0; font-size: 12px; border: 1px solid #9c27b0; padding: 5px; width: auto; margin: 20px auto; display: block; }
        
        /* 🚨 V7 新增：環境警告遮罩 🚨 */
        #browserWarning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(211, 47, 47, 0.95); color: white; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center;
        }
        #browserWarning h1 { font-size: 24px; margin-bottom: 10px; }
        #browserWarning p { font-size: 18px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- 🚨 V7 環境防護遮罩 🚨 -->
    <div id="browserWarning">
        <h1>⚠️ 系統阻擋：環境不支援</h1>
        <p>您目前使用的是 LINE 或其他內建瀏覽器，系統無法取得 GPS 定位權限。</p>
        <p style="font-weight: bold; background: #fff; color: #d32f2f; padding: 10px; border-radius: 5px; margin-top: 20px;">
            👉 請點擊右上角 (或右下角) 的「選單 ⋮」<br>選擇「以預設瀏覽器開啟」或「在 Chrome/Safari 開啟」來進行打卡。
        </p>
    </div>

    <!-- 系統主體與 V6 完全相同 -->
    <div class="panel">
        <h3>⚙️ 系統參數調校面板</h3>
        <div class="control-group">
            <label>後端 API 網址 (系統預載)：</label>
            <input type="text" id="apiUrl" value="https://script.google.com/macros/s/AKfycbyf-FCecsNUOWWS3repfDsg8YHEk6zhUNHoOPXwMFW93aF8_ch3w5QOW_nb-WgzWof8gQ/exec" readonly style="background:#e9ecef; font-size: 10px; color:#555;">
        </div>
        <div class="param-row">
            <div class="control-group">
                <label>容忍時間 (分)：</label>
                <input type="number" id="timeBuffer" value="10" readonly style="background:#e9ecef;">
            </div>
            <div class="control-group">
                <label>精度要求 (公尺)：</label>
                <input type="number" id="gpsAccuracy" value="12" readonly style="background:#e9ecef;">
            </div>
        </div>
    </div>

    <div class="panel highlight" id="guardPanel">
        <h3>📍 當前掃描站點</h3>
        <div id="lockWarning" class="lock-warning">⚠️ 系統鎖定：請使用相機掃描巡邏點 QR Code，禁止手動打卡。</div>
        <div class="control-group">
            <input type="text" id="locationInput" value="" placeholder="等待 QR Code 參數載入..." readonly style="background:#fff3e0; font-size: 16px; font-weight: bold; color: #e65100; text-align: center;">
        </div>
        <button id="checkInBtn" onclick="executeCheckIn()" disabled>送出定位與打卡紀錄</button>
    </div>

    <div class="log" id="consoleLog">系統初始化... 檢查運行環境中...</div>

    <button class="admin-toggle" onclick="toggleAdminPanel()">🔧 切換至 QR Code 產生器 (主管專用)</button>

    <div class="panel" id="adminPanel">
        <h3 style="color: #9c27b0;">🖨️ QR Code 標籤產生器</h3>
        <div class="control-group">
            <label>1. 選擇要建立 QR Code 的巡邏點：</label>
            <select id="genLocationSelect">
                <option value="A01 >> 13F 恩典前頂樓">A01 >> 13F 恩典前頂樓</option>
                <option value="A02 >> 11F 執行長室">A02 >> 11F 執行長室</option>
                <option value="A03 >> 10F 護理站">A03 >> 10F 護理站</option>
                <option value="A04 >> 09F 護理站">A04 >> 09F 護理站</option>
                <option value="B01 >> 13F 恩典後頂樓">B01 >> 13F 恩典後頂樓</option>
                <option value="C01 >> 05F 中國醫">C01 >> 05F 中國醫</option>
                <option value="D01 >> 垃圾屋">D01 >> 垃圾屋</option>
            </select>
        </div>
        <button onclick="generateQRCode()" style="background: #9c27b0;">2. 產生該點專屬 QR Code</button>
        
        <div id="qrcode-container">
            <div id="qrcode"></div>
            <p id="qr-text" style="font-weight: bold; margin-top: 10px; font-size: 18px; color: #333;"></p>
            <p style="font-size: 12px; color: #666;">(請截圖或列印此 QR Code，張貼於該巡邏點現場)</p>
        </div>
    </div>

    <script>
        function logMsg(msg, type = 'info') {
            const logBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            let prefix = '[系統] ', colorClass = '';
            if (type === 'error') { prefix = '[錯誤] '; colorClass = 'class="error"'; }
            if (type === 'warning') { prefix = '[警告] '; colorClass = 'class="warning"'; }
            logBox.innerHTML += `\n<span ${colorClass}>${time} ${prefix}${msg}</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        let qrcodeObj = null;

        document.addEventListener('DOMContentLoaded', () => {
            // 🚨 步驟 1：優先偵測危險運行環境 (LINE/FB/IG) 🚨
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/Line|FBAV|Instagram/i.test(userAgent)) {
                document.getElementById('browserWarning').style.display = 'flex';
                document.body.style.overflow = 'hidden'; // 鎖死背景滾動
                return; // 終止後續邏輯，強制使用者跳轉
            }

            // 步驟 2：執行正常的 QR 參數解析
            const urlParams = new URLSearchParams(window.location.search);
            const locParam = urlParams.get('loc'); 
            
            const locationInput = document.getElementById('locationInput');
            const checkInBtn = document.getElementById('checkInBtn');
            const lockWarning = document.getElementById('lockWarning');

            if (locParam) {
                const decodedLoc = decodeURIComponent(locParam);
                locationInput.value = decodedLoc;
                checkInBtn.disabled = false;
                logMsg(`✅ 成功辨識 QR Code：${decodedLoc}，系統解鎖。`);
            } else {
                lockWarning.style.display = 'block';
                logMsg("未偵測到地點參數，拒絕解鎖打卡功能。若是主管請點擊下方產生器。", "error");
            }
        });

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
        }

        function generateQRCode() {
            const loc = document.getElementById('genLocationSelect').value;
            const qrContainer = document.getElementById('qrcode');
            const qrText = document.getElementById('qr-text');
            const baseUrl = window.location.origin + window.location.pathname;
            const targetUrl = `${baseUrl}?loc=${encodeURIComponent(loc)}`;
            
            qrContainer.innerHTML = '';
            qrcodeObj = new QRCode(qrContainer, {
                text: targetUrl, width: 200, height: 200,
                colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
            qrText.innerText = `巡邏點：${loc}`;
            logMsg(`已產生 [${loc}] 的 QR Code，網址綁定為：${targetUrl}`);
        }

        function executeCheckIn() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const requiredAccuracy = document.getElementById('gpsAccuracy').value;
            const locationStr = document.getElementById('locationInput').value;
            const btn = document.getElementById('checkInBtn');

            if (!locationStr) return; 

            btn.disabled = true;
            btn.innerText = "資料驗證與傳輸中...";
            logMsg("啟動定位模組 (系統將請求您的 GPS 權限)...");

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    const accuracy = parseFloat(position.coords.accuracy.toFixed(1));
                    
                    let status = "正常";
                    if (accuracy > parseFloat(requiredAccuracy)) {
                        status = "精度異常(弱訊號)";
                    }

                    const payload = { location: locationStr, lat: lat, lng: lng, accuracy: accuracy, status: status };

                    logMsg("跨域寫入 Master Sheet 中...");

                    fetch(apiUrl, { method: 'POST', body: JSON.stringify(payload) })
                    .then(response => response.json())
                    .then(result => {
                        if (result.result === "success") {
                            logMsg(`✅ [${locationStr}] 打卡成功！`);
                            btn.innerText = "打卡完成，請關閉網頁";
                        } else {
                            logMsg(`寫入失敗：${result.message}`, "error");
                            btn.disabled = false; btn.innerText = "重試打卡";
                        }
                    })
                    .catch(error => { 
                        logMsg(`網路傳輸錯誤：${error.message}`, "error"); 
                        btn.disabled = false; btn.innerText = "重試打卡";
                    });
                },
                (error) => {
                    let errorMsg = "未知錯誤";
                    if(error.code === error.PERMISSION_DENIED) errorMsg = "使用者拒絕提供位置授權 (請至手機設定開啟權限)";
                    if(error.code === error.POSITION_UNAVAILABLE) errorMsg = "無法獲取位置資訊 (訊號不良)";
                    if(error.code === error.TIMEOUT) errorMsg = "獲取位置超時";
                    logMsg(errorMsg, "error");
                    btn.disabled = false; btn.innerText = "重新定位與打卡";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
