<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巡邏打卡工具 (V24 空間註冊引擎版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
        .panel { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .control-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        input[type="number"], input[type="text"], input[type="password"], select { padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 15px; background: #4a90e2; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;}
        button:active { background: #357abd; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-full { width: 100%; margin-top: 5px; padding: 15px 20px; font-size: 18px; }
        .log { margin-top: 20px; font-family: monospace; background: #222; color: #0f0; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 12px; height: 100px; overflow-y: auto;}
        .highlight { border-left: 4px solid #4a90e2; padding-left: 10px; }
        .lock-warning { color: #d32f2f; font-weight: bold; padding: 10px; background: #ffebee; border-radius: 4px; text-align: center; margin-bottom: 10px; display: none; }
        #adminPanel { display: none; border: 2px solid #9c27b0; background: #fdfaf6; padding: 20px;}
        #qrcode-container { margin-top: 15px; display: flex; flex-direction: column; align-items: center; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; display: none;}
        #secretLock { display: block; text-align: center; margin-top: 30px; font-size: 24px; opacity: 0.15; cursor: pointer; user-select: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background-color: #f5f5f5; font-weight: bold; }
        .bg-orange { background-color: #ffe0b2 !important; color: #e65100; font-weight: bold; } 
        .bg-red { background-color: #ffcdd2 !important; color: #c62828; font-weight: bold; }   
        .bg-green { background-color: #c8e6c9 !important; color: #2e7d32; }                     
        .bg-gray { background-color: #f5f5f5 !important; color: #9e9e9e; font-style: italic; }
        .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #e3f2fd; padding: 10px; border-radius: 4px;}
        .route-selector { background: #fff3e0; border: 1px solid #ffb74d; color: #e65100; font-weight: bold; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto 15px auto; border-radius: 8px; overflow: hidden; display: none; border: 3px solid #ffb74d; }
        #pwdModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 8px; width: 80%; max-width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .coords-box { background: #e8f5e9; padding: 10px; border: 1px solid #4caf50; border-radius: 4px; font-family: monospace; text-align: center; margin-top: 10px; color: #2e7d32; user-select: all;}
    </style>
</head>
<body>

    <!-- 密碼輸入對話框 -->
    <div id="pwdModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#9c27b0;">🛡️ 系統解鎖</h3>
            <p style="font-size:12px; color:#666;">請輸入主管專用密碼</p>
            <input type="password" id="adminPwdInput" placeholder="***" style="text-align:center; font-size:24px; letter-spacing: 5px;">
            <div class="modal-buttons">
                <button onclick="closePwdModal()" style="flex:1; background:#ccc; color:#333;">取消</button>
                <button onclick="submitPwd()" style="flex:1; background:#9c27b0;">確認</button>
            </div>
        </div>
    </div>

    <!-- 警衛面板 -->
    <div class="panel highlight" id="guardPanel">
        <h3>📍 當前掃描站點</h3>
        <div id="reader"></div>
        <button id="startScanBtn" class="btn-full" style="background: #ffb74d; color: #e65100; margin-bottom: 15px; display: none;" onclick="startWebScanner()">📷 點此開啟相機掃描 QR Code</button>
        <div id="lockWarning" class="lock-warning">⚠️ 請掃描站點上的 QR Code 解鎖。</div>
        <div class="control-group">
            <input type="text" id="locationInput" value="" placeholder="等待掃描結果..." readonly style="background:#fff3e0; font-size: 16px; font-weight: bold; color: #e65100; text-align: center;">
        </div>
        <button id="checkInBtn" class="btn-full" onclick="executeCheckIn()" disabled>送出定位與打卡紀錄</button>
        
        <div style="margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 15px;">
            <h4 style="margin:0 0 10px 0;">📋 今日個人巡檢動態</h4>
            <div class="control-group">
                <label>請選擇您目前負責的路線：</label>
                <select id="guardRouteSelect" class="route-selector" onchange="refreshDashboard(true)">
                    <option value="路線A">路線 A</option><option value="路線B">路線 B</option>
                    <option value="路線C">路線 C</option><option value="路線D">路線 D</option>
                    <option value="路線E">路線 E</option><option value="路線Z" selected>路線 Z (測試線)</option>
                </select>
            </div>
            <div id="guardDashboardContainer">系統載入中...</div>
        </div>
    </div>

    <div class="log" id="consoleLog">系統初始化... 等待操作...</div>
    <span id="secretLock" onclick="openPwdModal()">🔏</span>

    <!-- 主管面板 -->
    <div id="adminPanel">
        <h2 style="color: #9c27b0; text-align: center; border-bottom: 2px solid #9c27b0; padding-bottom: 10px;">🛡️ 主管控制中心</h2>
        <input type="hidden" id="apiUrl" value="https://script.google.com/macros/s/AKfycbyDMZUkObApUINPECHgfnHwo4UagSkhxdhV2R6evTZaRJBtqV2LBxW4uZ2uugQ09X7zNg/exec">
        
        <div class="panel" style="background: #fff;">
            <h3>📊 全路線狀態儀表板 (倒序排列)</h3>
            <div class="nav-controls">
                <button onclick="changeWeekOffset(-1)">◀ 上一週</button>
                <span id="weekDisplayLabel" style="font-weight:bold; color:#1565c0;">本週</span>
                <button onclick="changeWeekOffset(1)">下一週 ▶</button>
            </div>
            <div class="control-group">
                <label>選擇要稽核的路線：</label>
                <select id="adminRouteSelect" class="route-selector" onchange="refreshDashboard(false)">
                    <option value="路線A">路線 A</option><option value="路線B">路線 B</option>
                    <option value="路線C">路線 C</option><option value="路線D">路線 D</option>
                    <option value="路線E">路線 E</option><option value="路線Z" selected>路線 Z (測試線)</option>
                </select>
            </div>
            <button onclick="fetchDataAndRender(false)" style="background: #388e3c; padding: 10px; width: 100%;">重新從資料庫載入與驗證</button>
            <div id="adminDashboardContainer" style="overflow-x: auto; margin-top: 15px;"></div>
        </div>

        <!-- 🚨 V24 LBS 註冊與產生器引擎 🚨 -->
        <div class="panel" style="background: #fff;">
            <h3>🖨️ 站點註冊與標籤產生器</h3>
            <div class="control-group">
                <label>1. 選擇要註冊寫入的路線表：</label>
                <select id="regRouteSelect" class="route-selector">
                    <option value="路線A">路線 A</option><option value="路線B">路線 B</option>
                    <option value="路線C">路線 C</option><option value="路線D">路線 D</option>
                    <option value="路線E">路線 E</option><option value="路線Z" selected>路線 Z (測試線)</option>
                </select>
            </div>
            <div class="control-group">
                <label>2. 輸入站點名稱：</label>
                <input type="text" id="genLocationInput" placeholder="例: 測試點2">
            </div>
            <button id="registerBtn" onclick="registerAndGenerateQR()" class="btn-full" style="background: #9c27b0;">📍 定位、產生標籤並寫入資料庫</button>
            
            <div id="qrcode-container">
                <div id="qrcode"></div>
                <p id="qr-text" style="font-weight: bold; margin-bottom: 5px;"></p>
                <div id="coordsBox" class="coords-box">座標獲取中...</div>
            </div>
        </div>
    </div>

    <script>
        let currentWeekOffset = 0; 
        let cachedLogs = []; 
        let dynamicSchedules = {}; 
        let baseCoordsDict = {}; 
        let cloudParams = { timeTol: 10, distTol: 10, gpsAcc: 12 }; 
        let html5QrcodeScanner = null;

        function superNormalizeLoc(loc) {
            return loc ? loc.toString().replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '') : "";
        }

        function logMsg(msg, type = 'info') {
            const logBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            let color = type === 'error' ? 'color:#ff4444;' : type === 'warning' ? 'color:#ffeb3b;' : '';
            logBox.innerHTML += `\n<span style="${color}">${time} [系統] ${msg}</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const locParam = urlParams.get('loc'); 
            if (locParam) {
                processScannedLocation(decodeURIComponent(locParam));
            } else {
                document.getElementById('lockWarning').style.display = 'block';
                document.getElementById('startScanBtn').style.display = 'block';
            }
        });

        function startWebScanner() {
            document.getElementById('startScanBtn').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(
                (decodedText, decodedResult) => {
                    logMsg(`相機掃描成功。`);
                    html5QrcodeScanner.clear(); 
                    document.getElementById('reader').style.display = 'none';
                    try {
                        const scannedUrl = new URL(decodedText);
                        const extractedLoc = scannedUrl.searchParams.get('loc');
                        if (extractedLoc) {
                            processScannedLocation(decodeURIComponent(extractedLoc));
                        } else {
                            logMsg("找不到地點參數。", "error"); alert("無效的 QR Code");
                            document.getElementById('startScanBtn').style.display = 'block'; 
                        }
                    } catch (e) { document.getElementById('startScanBtn').style.display = 'block'; }
                }, (errorMessage) => { }
            );
        }

        function processScannedLocation(locationName) {
            document.getElementById('locationInput').value = locationName.trim();
            document.getElementById('checkInBtn').disabled = false;
            document.getElementById('lockWarning').style.display = 'none';
            logMsg(`✅ 成功解鎖站點：${locationName.trim()}。`);
            fetchDataAndRender(true);
        }

        function openPwdModal() {
            document.getElementById('pwdModal').style.display = 'flex';
            document.getElementById('adminPwdInput').value = '';
            document.getElementById('adminPwdInput').focus();
        }
        function closePwdModal() { document.getElementById('pwdModal').style.display = 'none'; }

        function submitPwd() {
            const pin = document.getElementById('adminPwdInput').value;
            if (!pin) return;
            closePwdModal();
            const apiUrl = document.getElementById('apiUrl').value.trim();
            logMsg("連線驗證權限...");

            fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: "verify_pin", pin: pin }) })
            .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
            .then(result => {
                if (result.result === "success") {
                    logMsg("✅ 解鎖成功。");
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('guardPanel').style.display = 'none';
                    document.getElementById('secretLock').style.display = 'none';
                    if (html5QrcodeScanner) html5QrcodeScanner.clear();
                    fetchDataAndRender(false);
                } else { alert("密碼錯誤"); }
            }).catch(e => logMsg(`連線失敗：${e.message}`, "error"));
        }

        // 🚨 V24 核心：結合 GPS 與後端註冊的 QR 產生器 🚨
        function registerAndGenerateQR() {
            const loc = document.getElementById('genLocationInput').value.trim();
            const targetRoute = document.getElementById('regRouteSelect').value;
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const btn = document.getElementById('registerBtn');
            const qrContainer = document.getElementById('qrcode-container');
            const coordsBox = document.getElementById('coordsBox');
            
            if(!loc) return alert("請輸入站點名稱");

            btn.disabled = true;
            btn.innerText = "獲取 GPS 並寫入資料庫中...";
            qrContainer.style.display = 'flex';
            coordsBox.innerText = "定位中，請稍候...";
            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('qr-text').innerText = '';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lng = pos.coords.longitude.toFixed(6);
                    coordsBox.innerHTML = `X (緯度): ${lat}<br>Y (經度): ${lng}`;
                    
                    // 產生 QR Code
                    const targetUrl = `${window.location.origin}${window.location.pathname}?loc=${encodeURIComponent(loc)}`;
                    new QRCode(document.getElementById('qrcode'), { text: targetUrl, width: 180, height: 180 });
                    document.getElementById('qr-text').innerText = loc;

                    // 發送至後端寫入路線表
                    fetch(apiUrl, { 
                        method: 'POST', 
                        body: JSON.stringify({ action: "register_site", route: targetRoute, location: loc, lat: lat, lng: lng }) 
                    })
                    .then(res => res.json())
                    .then(result => {
                        if (result.result === "success") {
                            logMsg(`✅ 站點 [${loc}] 已註冊至 [${targetRoute}]。(${result.message})`);
                            coordsBox.innerHTML += `<br><span style="color:#1565c0; font-size:12px;">✅ 座標已自動寫入試算表</span>`;
                        } else {
                            logMsg(`寫入資料庫失敗：${result.message}`, "error");
                            coordsBox.innerHTML += `<br><span style="color:#d32f2f; font-size:12px;">❌ 寫入失敗，請手動複製上方座標</span>`;
                        }
                    })
                    .catch(err => {
                        logMsg(`網路連線異常：${err.message}`, "error");
                    })
                    .finally(() => {
                        btn.disabled = false;
                        btn.innerText = "📍 定位、產生標籤並寫入資料庫";
                    });
                },
                (err) => { 
                    logMsg("無法獲取 GPS 權限，無法註冊站點", "error"); 
                    coordsBox.innerHTML = `<span style="color:#d32f2f;">❌ 無法獲取 GPS 權限</span>`;
                    btn.disabled = false; 
                    btn.innerText = "📍 定位、產生標籤並寫入資料庫"; 
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function executeCheckIn() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const locationStr = document.getElementById('locationInput').value.trim();
            const btn = document.getElementById('checkInBtn');
            if (!locationStr) return; 

            btn.disabled = true; btn.innerText = "傳輸中...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const payload = { action: "check_in", location: locationStr, lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6), accuracy: parseFloat(pos.coords.accuracy.toFixed(1)) };
                    fetch(apiUrl, { method: 'POST', body: JSON.stringify(payload) })
                    .then(res => res.json())
                    .then(result => {
                        if (result.result === "success") {
                            logMsg(`✅ 打卡完成！`); btn.innerText = "已完成";
                            fetchDataAndRender(true); 
                        } else { btn.disabled = false; btn.innerText = "重試"; }
                    });
                },
                (err) => { logMsg("定位失敗", "error"); btn.disabled = false; btn.innerText = "重試"; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function changeWeekOffset(delta) {
            currentWeekOffset += delta;
            let label = currentWeekOffset === 0 ? "本週" : currentWeekOffset < 0 ? `前 ${Math.abs(currentWeekOffset)} 週` : `後 ${currentWeekOffset} 週`;
            document.getElementById('weekDisplayLabel').innerText = label;
            refreshDashboard(false);
        }

        function refreshDashboard(isGuardView) {
            const selectedRoute = isGuardView ? document.getElementById('guardRouteSelect').value : document.getElementById('adminRouteSelect').value;
            const routeSchedule = dynamicSchedules[selectedRoute] || [];
            renderScheduleMatrix(cachedLogs, routeSchedule, isGuardView);
        }

        function parseTimeStringToMins(timeStr) {
            let isPM = timeStr.includes("下午") || timeStr.includes("PM");
            let match = timeStr.match(/(\d{1,2}):(\d{2})/);
            if(!match) return 0;
            let h = parseInt(match[1]);
            let m = parseInt(match[2]);
            if (isPM && h !== 12) h += 12;
            if (!isPM && timeStr.includes("上午") && h === 12) h = 0;
            return h * 60 + m;
        }

        function parseSheetDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split(' ');
            if (parts.length < 3) return new Date(dateStr); 
            const datePart = parts[0]; 
            const mins = parseTimeStringToMins(dateStr);
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return new Date(`${datePart} ${h}:${m}:00`);
        }

        function isTimeWithinTolerance(logMins, slotMins, tol) {
            let diff = Math.abs(logMins - slotMins);
            if (diff > 720) diff = 1440 - diff; 
            return diff <= tol;
        }

        function calculateHaversine(lat1, lon1, lat2, lon2) {
            const R = 6371e3; const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        function fetchDataAndRender(isGuardView) {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            logMsg("同步資料與雲端參數中...");
            fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: "get_dashboard_data" }) })
            .then(res => { if(!res.ok) throw new Error("HTTP 錯誤"); return res.json(); })
            .then(result => {
                if(result.result === "success") {
                    cachedLogs = result.logs;
                    if(result.sysParams) cloudParams = result.sysParams;
                    
                    baseCoordsDict = {}; 
                    dynamicSchedules = {}; 
                    const routeNames = ["路線A", "路線B", "路線C", "路線D", "路線E", "路線Z"];
                    routeNames.forEach(route => {
                        dynamicSchedules[route] = [];
                        const sData = result.schedule[route];
                        if (sData && sData.length > 0) {
                            for(let i=1; i<sData.length; i++) {
                                if(sData[i][0]) {
                                   const cleanName = superNormalizeLoc(sData[i][0]);
                                   baseCoordsDict[cleanName] = { lat: parseFloat(sData[i][1]), lng: parseFloat(sData[i][2]) };
                                }
                                const displayLoc = sData[i][0]; 
                                const timeStr = sData[i][3]; 
                                if(displayLoc && timeStr) {
                                    const mins = parseTimeStringToMins(timeStr);
                                    const hh = Math.floor(mins / 60).toString().padStart(2, '0');
                                    const mm = (mins % 60).toString().padStart(2, '0');
                                    dynamicSchedules[route].push({ loc: displayLoc, normLoc: superNormalizeLoc(displayLoc), time: `${hh}:${mm}`, mins: mins });
                                }
                            }
                        }
                    });
                    
                    logMsg(`✅ 資料同步完成。`);
                    refreshDashboard(isGuardView);
                }
            }).catch(e => logMsg(`載入失敗：${e.message}`, "error"));
        }

        function renderScheduleMatrix(logs, scheduleConfig, isGuardView) {
            const container = document.getElementById(isGuardView ? 'guardDashboardContainer' : 'adminDashboardContainer');
            if (scheduleConfig.length === 0) {
                container.innerHTML = `<div style="padding:10px; color:#d32f2f; background:#ffebee;">此路線尚無排班資料。</div>`;
                return;
            }

            const timeTol = cloudParams.timeTol;
            const distTol = cloudParams.distTol; 
            const gpsAccLimit = cloudParams.gpsAcc; 
            
            let targetDates = [];
            const today = new Date();
            today.setHours(0,0,0,0);

            if (isGuardView) {
                targetDates.push(new Date(today)); 
            } else {
                const dayOfWeek = today.getDay() || 7; 
                const monday = new Date(today);
                monday.setDate(today.getDate() - dayOfWeek + 1 + (currentWeekOffset * 7));
                for(let i=0; i<7; i++) {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    targetDates.push(d);
                }
            }

            let sortedScheduleConfig = [...scheduleConfig].sort((a, b) => b.mins - a.mins);
            let html = `<table><tr><th>日期</th><th>預定</th><th>站點</th><th>動態防偽驗證狀態</th></tr>`;
            
            for (let i = targetDates.length - 1; i >= 0; i--) {
                const targetDate = targetDates[i];
                const dateString = `${targetDate.getMonth()+1}/${targetDate.getDate()}`;
                const isFuture = targetDate > today;

                sortedScheduleConfig.forEach(slot => {
                    let rowClass = "";
                    let displayTime = "--:--";
                    let displayStatus = "";
                    let matchedLog = null;
                    
                    for (let row of logs) {
                        if (!row[0]) continue;
                        const logDate = parseSheetDate(row[0]);
                        if (!logDate) continue;
                        
                        const normLogRowLoc = superNormalizeLoc(row[1]);

                        if (logDate.getFullYear() === targetDate.getFullYear() &&
                            logDate.getMonth() === targetDate.getMonth() &&
                            logDate.getDate() === targetDate.getDate() &&
                            normLogRowLoc === slot.normLoc) {
                            
                            const logMins = logDate.getHours() * 60 + logDate.getMinutes();
                            if (isTimeWithinTolerance(logMins, slot.mins, timeTol)) {
                                const finalH = logDate.getHours().toString().padStart(2, '0');
                                const finalM = logDate.getMinutes().toString().padStart(2, '0');
                                
                                matchedLog = { time: `${finalH}:${finalM}`, actualLat: row[2], actualLng: row[3], actualAcc: row[4], normLocName: normLogRowLoc };
                                break; 
                            }
                        }
                    }

                    if (matchedLog) {
                        let isDistAnomaly = false;
                        let isGpsAnomaly = false;
                        let finalMsg = "";

                        if (parseFloat(matchedLog.actualAcc) > gpsAccLimit) {
                            isGpsAnomaly = true;
                            finalMsg = `精度異常(弱訊號)`;
                        }

                        if (matchedLog.actualLat && matchedLog.actualLng && baseCoordsDict[matchedLog.normLocName]) {
                            const actualLat = parseFloat(matchedLog.actualLat);
                            const actualLng = parseFloat(matchedLog.actualLng);
                            const baseLat = baseCoordsDict[matchedLog.normLocName].lat;
                            const baseLng = baseCoordsDict[matchedLog.normLocName].lng;
                            
                            if (!isNaN(actualLat) && !isNaN(actualLng)) {
                                const dynamicDist = calculateHaversine(baseLat, baseLng, actualLat, actualLng);
                                if (dynamicDist > distTol) {
                                    isDistAnomaly = true;
                                    finalMsg = finalMsg ? `${finalMsg}<br>定位點異常 (偏離 ${dynamicDist.toFixed(1)}m)` : `定位點異常 (偏離 ${dynamicDist.toFixed(1)}m)`;
                                } else {
                                    if (!isGpsAnomaly) finalMsg = `正常 (誤差 ${dynamicDist.toFixed(1)}m)`;
                                }
                            }
                        } else {
                            isDistAnomaly = true; 
                            finalMsg = "無基準資料或座標遺失";
                        }

                        if (isDistAnomaly || isGpsAnomaly) {
                            rowClass = "bg-orange";
                            displayStatus = `🟠 ${finalMsg}`;
                        } else {
                            rowClass = "bg-green";
                            displayStatus = `🟢 正常打卡`;
                        }
                        displayTime = matchedLog.time; 
                    } else {
                        if (isFuture) {
                            rowClass = "bg-gray";
                            displayStatus = "未到班";
                        } else {
                            rowClass = "bg-red";
                            displayStatus = "🔴 未打卡";
                        }
                    }

                    html += `<tr class="${rowClass}"><td>${dateString}</td><td>${slot.time}</td><td><span style="font-size:11px;">${slot.loc}</span></td><td>${displayTime} <br> <span style="font-size:11px; font-weight:bold;">${displayStatus}</span></td></tr>`;
                });
            }
            html += `</table>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
