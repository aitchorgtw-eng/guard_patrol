<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巡邏打卡工具 (V10 視覺化儀表板版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
        .panel { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .control-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        input[type="number"], input[type="text"], select { padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .param-row { display: flex; gap: 10px; }
        .param-row .control-group { flex: 1; }
        button { padding: 15px 20px; background: #4a90e2; color: #fff; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px;}
        button:active { background: #357abd; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .log { margin-top: 20px; font-family: monospace; background: #222; color: #0f0; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 12px; height: 150px; overflow-y: auto;}
        .highlight { border-left: 4px solid #4a90e2; padding-left: 10px; }
        .lock-warning { color: #d32f2f; font-weight: bold; padding: 10px; background: #ffebee; border-radius: 4px; text-align: center; margin-bottom: 10px; display: none; }
        
        #adminPanel { display: none; border: 2px solid #9c27b0; background: #fdfaf6; padding: 20px;}
        #qrcode-container { margin-top: 15px; display: flex; flex-direction: column; align-items: center; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;}
        #secretLock { display: block; text-align: center; margin-top: 30px; font-size: 24px; opacity: 0.15; cursor: pointer; user-select: none; }
        
        /* 儀表板表格樣式 */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f5f5f5; font-weight: bold; }
        .bg-orange { background-color: #ffe0b2 !important; color: #e65100; font-weight: bold; } /* 距離異常 */
        .bg-red { background-color: #ffcdd2 !important; color: #c62828; font-weight: bold; }   /* 時間異常 */
        .bg-green { background-color: #c8e6c9 !important; color: #2e7d32; }                     /* 正常 */
    </style>
</head>
<body>

    <!-- 警衛唯一可見區域 (乾淨視角) -->
    <div class="panel highlight" id="guardPanel">
        <h3>📍 當前掃描站點</h3>
        <div id="lockWarning" class="lock-warning">⚠️ 系統鎖定：請掃描巡邏點 QR Code，禁止手動打卡。</div>
        <div class="control-group">
            <input type="text" id="locationInput" value="" placeholder="等待 QR Code..." readonly style="background:#fff3e0; font-size: 16px; font-weight: bold; color: #e65100; text-align: center;">
        </div>
        <button id="checkInBtn" onclick="executeCheckIn()" disabled>送出定位與打卡紀錄</button>
    </div>

    <div class="log" id="consoleLog">系統初始化... 等待操作...</div>
    <span id="secretLock" onclick="verifyAdminPin()">🔏</span>

    <!-- ================= 主管解鎖區域 ================= -->
    <div id="adminPanel">
        <h2 style="color: #9c27b0; text-align: center; border-bottom: 2px solid #9c27b0; padding-bottom: 10px;">🛡️ 主管控制中心</h2>
        
        <!-- 封裝參數面板，避免警衛修改 -->
        <div class="panel" style="background: #fff;">
            <h3>⚙️ 系統參數調校</h3>
            <div class="control-group">
                <label>API 網址 (V10)：</label>
                <!-- ⚠️ 請替換為您的 V10 GAS URL ⚠️ -->
                <input type="text" id="apiUrl" value="https://script.google.com/macros/s/AKfycbymgBcvvzq45TznnxfayEYKOEFl2zxX3E-0SDoZjl0ZuRpkROjGaSFujEbFYx3nQ-ohtw/exec" readonly style="background:#e9ecef;">
            </div>
            <div class="param-row">
                <div class="control-group"><label>時間容忍 (分)：</label><input type="number" id="timeBuffer" value="10"></div>
                <div class="control-group"><label>GPS精度 (公尺)：</label><input type="number" id="gpsAccuracy" value="12"></div>
                <div class="control-group"><label>距離異常 (公尺)：</label><input type="number" id="distanceTol" value="10" style="background:#ffe0b2; color:#e65100; font-weight:bold;"></div>
            </div>
        </div>

        <!-- QR Code 產生器 (新增路線 Z) -->
        <div class="panel" style="background: #fff;">
            <h3>🖨️ 標籤產生器</h3>
            <div class="control-group">
                <select id="genLocationSelect">
                    <optgroup label="路線 Z (測試線)">
                        <option value="A99 >> 測試站點一">A99 >> 測試站點一</option>
                        <option value="C02 >> 03F 茶水間">C02 >> 03F 茶水間</option>
                    </optgroup>
                    <!-- 保留 ABCD 歷史結構，簡化顯示空間 -->
                    <optgroup label="路線 A"><option value="A01 >> 13F 恩典前頂樓">A01 >> 13F 恩典前頂樓</option><option value="A04 >> 09F 護理站">A04 >> 09F 護理站</option></optgroup>
                </select>
            </div>
            <button onclick="generateQRCode()" style="background: #9c27b0; padding: 10px;">產生 QR Code</button>
            <div id="qrcode-container"><div id="qrcode"></div><p id="qr-text" style="font-weight: bold;"></p></div>
        </div>

        <!-- V10 核心：視覺化一週儀表板 -->
        <div class="panel" style="background: #fff;">
            <h3>📊 巡檢狀態儀表板 (最近 200 筆)</h3>
            <p style="font-size:12px; color:#666;">註：目前僅套用「路線 Z」的班表時間進行紅燈驗證。</p>
            <button onclick="fetchDashboardData()" style="background: #388e3c; padding: 10px;">載入 / 更新儀表板</button>
            <div id="dashboardContainer" style="overflow-x: auto;"></div>
        </div>
    </div>

    <script>
        function logMsg(msg, type = 'info') {
            const logBox = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            let color = type === 'error' ? 'color:#ff4444;' : type === 'warning' ? 'color:#ffeb3b;' : '';
            logBox.innerHTML += `\n<span style="${color}">${time} [系統] ${msg}</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        let qrcodeObj = null;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const locParam = urlParams.get('loc'); 
            if (locParam) {
                document.getElementById('locationInput').value = decodeURIComponent(locParam);
                document.getElementById('checkInBtn').disabled = false;
                logMsg(`✅ QR Code 辨識成功，解鎖打卡。`);
            } else {
                document.getElementById('lockWarning').style.display = 'block';
            }
        });

        // 觸發主管解鎖
        function verifyAdminPin() {
            const pin = prompt("請輸入主管密碼：");
            if (!pin) return;
            const apiUrl = document.getElementById('apiUrl').value.trim();
            logMsg("驗證主管權限中...");

            fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: "verify_pin", pin: pin }) })
            .then(res => res.json())
            .then(result => {
                if (result.result === "success") {
                    logMsg("✅ 解鎖成功。");
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('guardPanel').style.display = 'none';
                    document.getElementById('secretLock').style.display = 'none';
                } else { alert("密碼錯誤"); }
            }).catch(e => logMsg("連線錯誤", "error"));
        }

        function generateQRCode() {
            const loc = document.getElementById('genLocationSelect').value;
            const targetUrl = `${window.location.origin}${window.location.pathname}?loc=${encodeURIComponent(loc)}`;
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, { text: targetUrl, width: 180, height: 180 });
            document.getElementById('qr-text').innerText = loc;
        }

        // 打卡模組 (傳入 distanceTol)
        function executeCheckIn() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const locationStr = document.getElementById('locationInput').value;
            const btn = document.getElementById('checkInBtn');
            const distTol = document.getElementById('distanceTol').value;
            if (!locationStr) return; 

            btn.disabled = true; btn.innerText = "傳輸中...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const payload = { 
                        action: "check_in", location: locationStr, 
                        lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6), 
                        accuracy: parseFloat(pos.coords.accuracy.toFixed(1)), 
                        distanceTol: distTol, status: "正常" 
                    };
                    fetch(apiUrl, { method: 'POST', body: JSON.stringify(payload) })
                    .then(res => res.json())
                    .then(result => {
                        if (result.result === "success") {
                            logMsg(`✅ 打卡完成！`); btn.innerText = "已完成";
                        } else { btn.disabled = false; btn.innerText = "重試"; }
                    });
                },
                (err) => { logMsg("定位失敗", "error"); btn.disabled = false; btn.innerText = "重試"; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // ================= V10 核心：儀表板視覺化渲染 =================
        function fetchDashboardData() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            logMsg("載入儀表板資料中...");
            
            fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: "get_logs" }) })
            .then(res => res.json())
            .then(result => {
                if(result.result === "success") {
                    renderDashboard(result.data);
                    logMsg("✅ 儀表板渲染完成。");
                }
            });
        }

        function renderDashboard(rawData) {
            if (rawData.length <= 1) return; // 只有標題行
            const timeTol = parseInt(document.getElementById('timeBuffer').value);
            
            let html = `<table><tr><th>打卡時間</th><th>站點</th><th>距離判定</th><th>時間判定</th></tr>`;
            
            // 反轉陣列，最新的資料在最上面
            for (let i = rawData.length - 1; i > 0; i--) {
                const row = rawData[i];
                if (!row[0]) continue;
                
                const logTimeStr = row[0]; // 原始字串如 "2026/9/30 上午 10:15:00"
                const location = row[1];
                const distMsg = row[7] || ""; 
                
                let rowClass = "bg-green";
                let timeStatus = "🟢 正常";

                // 1. 判定距離異常 (橘色優先)
                if (distMsg.includes("距離異常")) {
                    rowClass = "bg-orange";
                } 
                // 2. 判定時間異常 (測試路線 Z: A99, C02)
                else if (location.includes("A99") || location.includes("C02")) {
                    // 擷取時與分進行比對 (使用 Regex 確保相容性)
                    const timeMatch = logTimeStr.match(/(\d{1,2}):(\d{2}):\d{2}/);
                    const isPM = logTimeStr.includes("下午");
                    
                    if (timeMatch) {
                        let hours = parseInt(timeMatch[1]);
                        const mins = parseInt(timeMatch[2]);
                        if (isPM && hours !== 12) hours += 12;
                        if (!isPM && hours === 12) hours = 0;
                        
                        const totalMins = hours * 60 + mins;
                        // 早班: 10:00(600) ~ 10:30(630)
                        const morningValid = (totalMins >= 600 - timeTol && totalMins <= 630 + timeTol);
                        // 午班: 13:30(810) ~ 14:00(840)
                        const afternoonValid = (totalMins >= 810 - timeTol && totalMins <= 840 + timeTol);
                        
                        if (!morningValid && !afternoonValid) {
                            rowClass = "bg-red";
                            timeStatus = "🔴 異常 (非排班時間)";
                        }
                    }
                } else {
                    timeStatus = "⚪ 尚無排班資料"; // ABCD 線日後擴充
                }

                html += `<tr class="${rowClass}">
                            <td>${logTimeStr}</td>
                            <td>${location}</td>
                            <td>${distMsg}</td>
                            <td>${timeStatus}</td>
                         </tr>`;
            }
            html += `</table>`;
            document.getElementById('dashboardContainer').innerHTML = html;
        }
    </script>
</body>
</html>
